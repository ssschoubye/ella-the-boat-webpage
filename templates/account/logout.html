{% extends "card_base.html" %}

{% block title %}Log ud &middot; Ella{% endblock %}

{% block card %}
<p class="card-page__lead">Vil du logge ud af Ella?</p>

<form method="post" action="{% url 'account_logout' %}" class="login-form">
    {% csrf_token %}
    {% if redirect_field_value %}
        <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}">
    {% endif %}
    <button type="submit">Log ud</button>
</form>
{% endblock %}
