---
name: build

# Runs the tests, then builds the production image and pushes it to
# ghcr.io/ssschoubye/ella. The run summary prints the tag to pin as
# ella_site_image_tag in home-server. See docs/deployment.md.
#
# WHY THIS IS NOT home-server's REUSABLE WORKFLOW
#
# It used to be `uses: ssschoubye/home-server/.github/workflows/
# build-site-image.yml@main`, and it never worked: every run failed in 0s with
# no jobs created. This repository is PUBLIC and home-server is PRIVATE, and a
# public repository cannot call a reusable workflow from a private one.
# home-server's "Accessible from repositories owned by the user" setting is
# already on, but that only extends access to *private* repos, so it does not
# help. The run dies while resolving `uses:`, which is why there is no job log
# and the error appears only in the Actions web UI.
#
# So the build job below is a copy of home-server's
# .github/workflows/build-site-image.yml. **If you change one, change the
# other** -- nothing keeps them in step. The alternative was making this repo
# private, which would also have made the GHCR package private and required a
# pull credential on the server.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py test

  build:
    needs: test
    runs-on: ubuntu-24.04
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ella
          # sha-<short> is the tag to pin. `latest` is deliberately absent:
          # the home-server repo forbids it.
          tags: |
            type=sha,format=short,prefix=sha-
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Tag to pin
        run: |
          echo "### Pin this tag in home-server" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "SITE_IMAGE_TAG=${{ steps.meta.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
